0su\x20siti\x20o\x20piattaforme\x20di\x20condivisione\x20accessibili\x20al\x20pubblico),\x20salvo\x20quanto\x20le\x20scuole\x20possono\x20fare\x20ai\x20sensi\x20del\x20punto\x202:\x20chi\x20è\x20interessato\x20va\x20indirizzato\x20al\x20**canale\x20ufficiale**\x20del\x20Licenziante,\x20così\x20ciascuno\x20riceve\x20sempre\x20la\x20versione\x20aggiornata;\x0a-\x20copiare\x20o\x20ripubblicare\x20i\x20file\x20del\x20programma\x20(pagina,\x20codice,\x20motore\x20di\x20calcolo,\x20grafica)\x20su\x20altri\x20siti,\x20server\x20o\x20piattaforme,\x20o\x20presentarlo\x20come\x20parte\x20di\x20un\x20altro\x20sito\x20o\x20servizio;\x0a-\x20vendere,\x20noleggiare,\x20prestare,\x20concedere\x20in\x20sublicenza\x20il\x20programma;\x0a-\x20modificare,\x20tradurre,\x20decompilare\x20o\x20disassemblare\x20il\x20programma,\x20o\x20ricavarne\x20opere\x20derivate,\x20salvo\x20nei\x20casi\x20consentiti\x20dalla\x20legge\x20sul\x20diritto\x20d\x27autore\x20(articoli\x2064-ter\x20e\x2064-quater\x20della\x20Legge\x20633/1941);\x0a-\x20eludere\x20o\x20rimuovere\x20le\x20misure\x20tecniche\x20che\x20proteggono\x20il\x20programma\x20(art.\x20102-quater\x20della\x20Legge\x20633/1941);\x0a-\x20togliere\x20o\x20alterare\x20il\x20nome,\x20il\x20logo,\x20gli\x20avvisi\x20di\x20diritto\x20d\x27autore\x20e\x20le\x20informazioni\x20legali\x20presenti\x20nel\x20programma.\x0a\x0aGli\x20studenti\x20possono\x20usare\x20il\x20programma\x20durante\x20le\x20attività\x20didattiche\x20e\x20a\x20casa,\x20come\x20previsto\x20al\x20punto\x202;\x20questo\x20non\x20trasferisce\x20loro\x20alcuna\x20licenza\x20diversa\x20da\x20quella\x20personale\x20e\x20gratuita\x20di\x20questo\x20contratto.\x0a\x0aI\x20banchi\x20salvati\x20(file\x20.gsv),\x20le\x20misure,\x20le\x20schede\x20stampate\x20e\x20gli\x20altri\x20lavori\x20che\x20l\x27Utente\x20crea\x20con\x20il\x20programma\x20**appartengono\x20all\x27Utente**,\x20che\x20può\x20usarli\x20liberamente.\x20I\x20docenti\x20possono\x20distribuire\x20liberamente\x20i\x20codi ratto.\x20I\x20nomi\x20dei\x20morsetti\x20e\x20le\x20sigle\x20usate\x20(per\x20esempio\x20quelle\x20della\x20norma\x20DIN\x2072552)\x20sono\x20riferimenti\x20tecnici;\x20eventuali\x20marchi\x20citati\x20appartengono\x20ai\x20rispettivi\x20titolari.\x0a\x0a##\x207.\x20Versioni\x20e\x20compatibilità\x20dei\x20file\x0aIl\x20Licenziante\x20può\x20migliorare\x20il\x20programma\x20con\x20nuove\x20versioni.\x20I\x20file\x20.gsv\x20salvati\x20restano\x20apribili\x20dalle\x20versioni\x20successive\x20per\x20quanto\x20possibile,\x20ma\x20la\x20compatibilità\x20non\x20è\x20garantita\x20in\x20ogni\x20caso:\x20conviene\x20conservare\x20una\x20copia\x20dei\x20propri\x20lavori.\x20I\x20codici\x20delle\x20verifiche\x20restano\x20validi\x20per\x20quanto\x20possibile,\x20ma\x20un\x20codice\x20preparato\x20con\x20una\x20versione\x20può\x20non\x20funzionare\x20con\x20versioni\x20molto\x20diverse.\x0a\x0a##\x208.\x20Aggiornamenti\x0aLa\x20**versione\x20web**\x20è\x20sempre\x20quella\x20pubblicata\x20in\x20quel\x20momento\x20sul\x20sito\x20ufficiale:\x20il\x20Licenziante\x20la\x20aggiorna\x20senza\x20preavviso\x20e\x20può\x20modificarla,\x20sospenderla\x20o\x20non\x20renderla\x20più\x20disponibile\x20in\x20qualsiasi\x20momento.\x20Il\x20file\x20scaricato\x20non\x20si\x20aggiorna\x20da\x20solo:\x20la\x20versione\x20aggiornata\x20si\x20scarica\x20di\x20nuovo\x20dal\x20canale\x20ufficiale.\x20Se\x20il\x20contratto\x20cambia,\x20la\x20nuova\x20versione\x20viene\x20mostrata\x20alla\x20prima\x20apertura\x20successiva\x20e\x20va\x20accettata\x20per\x20continuare\x20a\x20usare\x20il\x20programma.\x0a\x0a##\x209.\x20Avvertenze\x20sull\x27uso\x20dei\x20risultati\x0aIl\x20programma\x20è\x20uno\x20strumento\x20**didattico\x20e\x20di\x20simulazione**.\x20I\x20risultati\x20sono\x20calcolati\x20con\x20modelli\x20semplificati:\x20**non\x20sono\x20certificati**,\x20i\x20valori\x20dei\x20componenti\x20sono\x20tipici\x20e\x20possono\x20essere\x20diversi\x20da\x20quelli\x20di\x20un\x20veicolo\x20reale,\x20e 20Risoluzione\x0aSe\x20l\x27Utente\x20non\x20rispetta\x20questo\x20contratto,\x20la\x20licenza\x20termina\x20automaticamente\x20e\x20l\x27Utente\x20deve\x20smettere\x20di\x20usare\x20il\x20programma\x20e\x20cancellarlo,\x20compreso\x20il\x20file\x20eventualmente\x20scaricato.\x0a\x0a##\x2015.\x20Legge\x20applicabile\x20e\x20foro\x0aIl\x20contratto\x20è\x20regolato\x20dalla\x20legge\x20italiana.\x20Per\x20le\x20controversie\x20con\x20un\x20Utente\x20che\x20agisce\x20come\x20consumatore\x20è\x20competente\x20il\x20giudice\x20del\x20luogo\x20di\x20residenza\x20o\x20domicilio\x20del\x20consumatore;\x20negli\x20altri\x20casi\x20è\x20competente\x20il\x20foro\x20del\x20luogo\x20di\x20residenza\x20del\x20Licenziante.\x0a\x0a##\x2016.\x20Disposizioni\x20finali\x0aSe\x20una\x20clausola\x20risulta\x20non\x20valida,\x20le\x20altre\x20restano\x20efficaci.\x20Il\x20Licenziante\x20può\x20aggiornare\x20queste\x20condizioni\x20per\x20le\x20versioni\x20successive:\x20la\x20nuova\x20versione\x20del\x20contratto\x20sarà\x20mostrata\x20alla\x20prima\x20apertura\x20successiva\x20alla\x20modifica.\x0a\x0a©\x202026\x20Andrea\x20Aldini\x20–\x20Tutti\x20i\x20diritti\x20riservati.\x0a',Fn=_0x536ac8(0xa31),Ya='1.0',Gn={'licenza':Dn,'privacy':Fn},Hn=_0x4f9c38=>_0x4f9c38[_0x536ac8(0xcc3)](/[&<>"]/g,_0x2348ba=>({'&':_0x536ac8(0x4ca),'<':_0x536ac8(0x972),'>':_0x536ac8(0x186),'\x22':_0x536ac8(0xc48)}[_0x2348ba]));function kn(_0x2635fb){const _0x492adf=_0x536ac8,_0x2131a5=_0x55e4ba=>Hn(_0x55e4ba)['replace'](/\*\*(.+?)\*\*/g,_0x492adf(0x546))['replace'](/\*(.+?)\*/g,_0x492adf(0x65a))[_0x492adf(0xcc3)](/(https?:\/\/[^\s)]+[^\s).,;])/g,'<a\x20href=\x22$1\x22\x20target=\x22_blank\x22\x20rel=\x22noopener\x22>$1</a>'),_0x5d5ea7=[];let _0x5f04aa=!0x1;for(const _0x21e5e2 of _0x2635fb[_0x492adf(0x43b)]('\x0a')){const _0x5b4544=_0x21e5e2['trimEnd']();if(_0x5b4544[_0x492adf(0xb29)]('-\x20')){_0x5f04aa||_0x5d5ea7[_0x492adf(0x916)]('<ul>'),_0x5f04aa=!0x0,_0x5d5ea7[_0x492adf(0x916)](_0x492adf(0x56d)+_0x2131a5(_0x
