utore\x20i\x20tuoi\x20dati\x20personali,\x20i\x20tuoi\x20banchi\x20o\x20i\x20risultati\x20delle\x20verifiche.\x20La\x20versione\x20web\x20viene\x20scaricata\x20dal\x20sito\x20ufficiale,\x20ospitato\x20da\x20GitHub\x20Pages,\x20e\x20conserva\x20nel\x20browser\x20solo\x20l\x27accettazione\x20del\x20contratto,\x20le\x20preferenze\x20dell\x27interfaccia,\x20i\x20banchi\x20degli\x20esercizi\x20e\x20il\x20nome\x20e\x20la\x20classe\x20scritti\x20nell\x27ultima\x20scheda,\x20come\x20spiegato\x20nell\x27informativa.\x0a\x0a##\x2014.\x20Risoluzione\x0aSe\x20l\x27Utente\x20non\x20rispetta\x20questo\x20contratto,\x20la\x20licenza\x20termina\x20automaticamente\x20e\x20l\x27Utente\x20deve\x20smettere\x20di\x20usare\x20il\x20programma\x20e\x20cancellarlo,\x20compreso\x20il\x20file\x20eventualmente\x20scaricato.\x0a\x0a##\x2015.\x20Legge\x20applicabile\x20e\x20foro\x0aIl\x20contratto\x20è\x20regolato\x20dalla\x20legge\x20italiana.\x20Per\x20le\x20controversie\x20con\x20un\x20Utente\x20che\x20agisce\x20come\x20consumatore\x20è\x20competente\x20il\x20giudice\x20del\x20luogo\x20di\x20residenza\x20o\x20domicilio\x20del\x20consumatore;\x20negli\x20altri\x20casi\x20è\x20competente\x20il\x20foro\x20del\x20luogo\x20di\x20residenza\x20del\x20Licenziante.\x0a\x0a##\x2016.\x20Disposizioni\x20finali\x0aSe\x20una\x20clausola\x20risulta\x20non\x20valida,\x20le\x20altre\x20restano\x20efficaci.\x20Il\x20Licenziante\x20può\x20aggiornare\x20queste\x20condizioni\x20per\x20le\x20versioni\x20successive:\x20la\x20nuova\x20versione\x20del\x20contratto\x20sarà\x20mostrata\x20alla\x20prima\x20apertura\x20successiva\x20alla\x20modifica.\x0a\x0a©\x202026\x20Andrea\x20Aldini\x20–\x20Tutti\x20i\x20diritti\x20riservati.\x0a',xn=_0xdfb613(0x18b),Wa=_0xdfb613(0x62f),En={'licenza':In,'privacy':xn},wn=_0x534678=>_0x534678[_0xdfb613(0x214)](/[&<>"]/g,_0x161a6e=>({'&':_0xdfb613(0xc7f),'<':'&lt;','>':_0xdfb613(0xa71),'\x22':'&quot;'}[_0x161a6e]));function Pn(_0x2ab028){const _0x191ea2=_0xdfb613,_0x320026=_0xfe49cf=>wn
