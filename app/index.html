uttore.\x20Non\x20vanno\x20usati\x20da\x20soli\x20per\x20riparare,\x20modificare\x20o\x20verificare\x20veicoli\x20e\x20impianti\x20reali.\x20I\x20lavori\x20sugli\x20impianti\x20dei\x20veicoli\x20vanno\x20eseguiti\x20da\x20persone\x20qualificate,\x20nel\x20rispetto\x20delle\x20norme\x20vigenti\x20e\x20delle\x20istruzioni\x20del\x20costruttore.\x0a\x0a**Alta\x20tensione.**\x20Le\x20parti\x20sui\x20veicoli\x20ibridi\x20ed\x20elettrici\x20e\x20sulla\x20procedura\x20di\x20messa\x20in\x20sicurezza\x20sono\x20un\x20allenamento\x20e\x20**non\x20sostituiscono\x20la\x20formazione\x20e\x20la\x20qualifica**\x20(PES/PAV/PEI)\x20prevista\x20dalla\x20norma\x20CEI\x2011-27\x20e\x20dalle\x20regole\x20del\x20costruttore.\x20Sui\x20veicoli\x20reali\x20si\x20lavora\x20sull\x27alta\x20tensione\x20solo\x20con\x20la\x20qualifica\x20richiesta,\x20con\x20strumenti\x20adatti\x20(per\x20esempio\x20di\x20categoria\x20CAT\x20III)\x20e\x20con\x20i\x20dispositivi\x20di\x20protezione\x20previsti.\x0a\x0aLa\x20modalità\x20verifica\x20(codici,\x20guasti\x20nascosti)\x20è\x20un\x20aiuto\x20didattico,\x20non\x20una\x20protezione\x20informatica:\x20chi\x20analizza\x20il\x20programma\x20con\x20strumenti\x20propri\x20può\x20aggirarla.\x0a\x0a##\x2010.\x20Assenza\x20di\x20garanzia\x0aIl\x20programma\x20è\x20fornito\x20gratuitamente\x20**“così\x20com\x27è”**,\x20senza\x20garanzie\x20di\x20alcun\x20tipo,\x20espresse\x20o\x20implicite,\x20comprese\x20quelle\x20di\x20funzionamento,\x20assenza\x20di\x20errori\x20o\x20idoneità\x20a\x20uno\x20scopo\x20particolare,\x20nei\x20limiti\x20consentiti\x20dalla\x20legge.\x20Per\x20la\x20versione\x20web\x20non\x20è\x20garantita\x20la\x20disponibilità\x20continua,\x20che\x20dipende\x20anche\x20dal\x20servizio\x20che\x20ospita\x20il\x20sito\x20e\x20dalla\x20connessione\x20dell\x27Utente.\x20I\x20banchi\x20vanno\x20salvati\x20in\x20un\x20file:\x20quelli\x20lasciati\x20solo\x20nel\x20browser\x20possono\x20andare\x20persi,\x20per\x20esempio\x20cancellando\x20i\x20dati\x20del\x20sito.\x0a\x0a##\x2011.\x20Limitazione\x20di\x20responsabilità\x0aNei\x20limiti\x20consentiti\x20dalla\x20legge,\x20il\x20Licenziante\x20non\x20risponde\x20di\x20danni\x20diretti\x20o\x20indiretti,\x20perdite\x20di\x20dati,\x20di\x20guadagno\x20o\x20di\x20opportunità\x20derivanti\x20dall\x27uso\x20o\x20dal\x20mancato\x20uso\x20del\x20programma.\x20Restano\x20ferme\x20le\x20responsabilità\x20che\x20la\x20legge\x20non\x20permette\x20di\x20escludere,\x20in\x20particolare\x20per\x20dolo\x20o\x20colpa\x20grave\x20(art.\x201229\x20del\x20Codice\x20civile)\x20e\x20quelle\x20previste\x20a\x20tutela\x20dei\x20consumatori.\x0a\x0a##\x2012.\x20Segnalazioni\x20e\x20suggerimenti\x0aL\x27Utente\x20può\x20segnalare\x20errori\x20e\x20proporre\x20miglioramenti\x20all\x27indirizzo\x20gisquare.circuiti@gmail.com.\x20Inviando\x20un\x20suggerimento,\x20consente\x20al\x20Licenziante\x20di\x20usarlo\x20liberamente\x20e\x20gratuitamente\x20per\x20migliorare\x20il\x20programma,\x20senza\x20obbligo\x20di\x20compenso.\x20I\x20file\x20.gsv\x20inviati\x20per\x20le\x20segnalazioni\x20restano\x20dell\x27Utente\x20e\x20sono\x20usati\x20solo\x20per\x20risolvere\x20il\x20problema.\x0a\x0a##\x2013.\x20Dati\x20personali\x0aIl\x20trattamento\x20dei\x20dati\x20è\x20descritto\x20nell\x27**Informativa\x20sulla\x20privacy**\x20presente\x20nel\x20programma.\x20Il\x20programma\x20non\x20raccoglie\x20né\x20invia\x20all\x27autore\x20i\x20tuoi\x20dati\x20personali,\x20i\x20tuoi\x20banchi\x20o\x20i\x20risultati\x20delle\x20verifiche.\x20La\x20versione\x20web\x20viene\x20scaricata\x20dal\x20sito\x20ufficiale,\x20ospitato\x20da\x20GitHub\x20Pages,\x20e\x20conserva\x20nel\x20browser\x20solo\x20l\x27accettazione\x20del\x20contratto,\x20le\x20preferenze\x20dell\x27interfaccia,\x20i\x20banchi\x20degli\x20esercizi\x20e\x20il\x20nome\x20e\x20la\x20classe\x20scritti\x20nell\x27ultima\x20scheda,\x20come\x20spiegato\x20nell\x27informativa.\x0a\x0a##\x2014.\x20Risoluzione\x0aSe\x20l\x27Utente\x20non\x20rispetta\x20questo\x20contratto,\x20la\x20licenza\x20termina\x20automaticamente\x20e\x20l\x27Utente\x20deve\x20smettere\x20di\x20usare\x20il\x20programma\x20e\x20cancellarlo,\x20compreso\x20il\x20file\x20eventualmente\x20scaricato.\x0a\x0a##\x2015.\x20Legge\x20applicabile\x20e\x20foro\x0aIl\x20contratto\x20è\x20regolato\x20dalla\x20legge\x20italiana.\x20Per\x20le\x20controversie\x20con\x20un\x20Utente\x20che\x20agisce\x20come\x20consumatore\x20è\x20competente\x20il\x20giudice\x20del\x20luogo\x20di\x20residenza\x20o\x20domicilio\x20del\x20consumatore;\x20negli\x20altri\x20casi\x20è\x20competente\x20il\x20foro\x20del\x20luogo\x20di\x20residenza\x20del\x20Licenziante.\x0a\x0a##\x2016.\x20Disposizioni\x20finali\x0aSe\x20una\x20clausola\x20risulta\x20non\x20valida,\x20le\x20altre\x20restano\x20efficaci.\x20Il\x20Licenziante\x20può\x20aggiornare\x20queste\x20condizioni\x20per\x20le\x20versioni\x20successive:\x20la\x20nuova\x20versione\x20del\x20contratto\x20sarà\x20mostrata\x20alla\x20prima\x20apertura\x20successiva\x20alla\x20modifica.\x0a\x0a©\x202026\x20Andrea\x20Aldini\x20–\x20Tutti\x20i\x20diritti\x20riservati.\x0a',Xo=_0x17fc0f(0x946),Ge=_0x17fc0f(0x297),Qo={'licenza':Wo,'privacy':Xo},Zo=_0x1aed4f=>_0x1aed4f['replace'](/[&<>"]/g,_0x4d05f2=>({'&':'&amp;','<':_0x17fc0f(0x6c1),'>':_0x17fc0f(0x40c),'\x22':_0x17fc0f(0x89c)}[_0x4d05f2]));function Ko(_0x1bcb83){const _0x25caab=_0x17fc0f,_0x262fd8=_0x57776b=>Zo(_0x57776b)['replace'](/\*\*(.+?)\*\*/g,_0x25caab(0xb1))[_0x25caab(0x310)](/\*(.+?)\*/g,_0x25caab(0x286))['replace'](/(https?:\/\/[^\s)]+[^\s).,;])/g,_0x25caab(0x3fc)),_0x181bca=[];let _0x2e5fbe=!0x1;for(const _0x449489 of _0x1bcb83[_0x25caab(0x8fa)]('\x0a')){const _0x3ba832=_0x449489[_0x25caab(0x8dc)]();if(_0x3ba832[_0x25caab(0x6a2)]('-\x20')){_0x2e5fbe||_0x181bca[_0x25caab(0x1fb)](_0x25caab(0x156)),_0x2e5fbe=!0x0,_0x181bca[_0x25caab(0x1fb)](_0x25caab(0x675)+_0x262fd8(_0x3ba832['slice'](0x2))+'</li>');continue;}if(_0x2e5fbe&&(_0x181bca[_0x25caab(0x1fb)](_0x25caab(0x83)),_0x2e5fbe=!0x1)
